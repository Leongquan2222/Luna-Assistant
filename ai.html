<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Assistant</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="ai.css">
</head>

<body>
    <div class="container-fluid vh-100">
        <div class="row h-100">

            <!-- ================= Sidebar ================= -->
            <aside class="col-lg-3 col-md-4 sidebar d-flex flex-column p-3">
                <h2 class="logo mb-3">Luna Assistant</h2>


                <!-- Nút Chat Mới -->
                <button id="newChatBtn" class="btn btn-primary mb-3 w-100">
                    <i class="bi bi-plus-lg me-1"></i> Cuộc trò chuyện mới
                </button>

                <!-- Ô Tìm kiếm Lịch sử -->
                <div class="mb-2">
                    <input type="text" id="searchHistory" class="form-control form-control-sm bg-dark text-light border-secondary" placeholder="Tìm lịch sử...">
                </div>

                <!-- Danh sách Lịch sử Chat -->
                <div id="historyList" class="history-list flex-grow-1 overflow-auto mb-3"></div>

                <!-- Nút Xóa Lịch sử -->
                <button id="clearHistoryBtn" class="btn btn-outline-danger btn-sm w-100 mt-auto">
                    <i class="bi bi-trash3-fill me-1"></i> Xóa lịch sử
                </button>
            </aside>

            <!-- ================= Main Content ================= -->
            <main class="col-lg-9 col-md-8 main-content d-flex flex-column p-0">
                <!-- Header -->
                <div class="chat-header d-flex justify-content-between align-items-center p-3 border-bottom">
                    <div>
                        <h3 class="m-0 fs-5 fw-bold">Luna Assistant</h3>
                        <small class="text-muted">Your AI Learning Assistant</small>
                    </div>
                </div>

                <!-- Chat Body -->
                <section class="chat-body flex-grow-1 p-3 overflow-auto" id="chatBody"></section>

                <!-- Footer Input -->
                <footer class="chat-footer p-3 border-top d-flex gap-2">
                    <input id="prompt" type="text" class="form-control" autocomplete="off" placeholder="Hỏi Luna bất cứ điều gì...">
                    <button id="sendBtn" class="btn btn-primary">
                        <i class="bi bi-send-fill"></i>
                    </button>
                </footer>
            </main>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <script defer src="systemprompt.js"></script>
    <script defer type="module" src="ai.js"></script>
    <script defer src="theme-changer.js"></script>
</body>

</html>
