<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luna Assistant - Minimalist Dock</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">

    <!-- CSS -->
    <link id="theme-style" rel="stylesheet" href="theme-ember.css">
    <link rel="stylesheet" href="ai.css">
</head>

<body>

    <div class="container-fluid app-viewport">
        <!-- Background Blobs -->
        <div class="bg-blob blob1"></div>
        <div class="bg-blob blob2"></div>

        <!-- Floating Top Dock -->
        <header class="top-dock">
            <div class="character-info">
                <div class="avatar">
                    <i class="bi bi-moon-stars-fill"></i>
                </div>
                <div>
                    <h1 class="character-name">Luna Assistant</h1>
                    <p class="character-role">Gia sư AI • Sắc sảo & Điềm tĩnh</p>
                </div>
            </div>

            <div class="dock-controls">

                <!-- New Chat Button -->
                <button id="newChatBtn" class="btn btn-outline-light btn-sm reset-btn" title="Làm mới trò chuyện">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </header>

        <!-- Main Full-Width Chat Stream Container -->
        <main class="chat-container">
            <div id="chatBody" class="chat-body">

            
            </div>
        </main>

        <!-- Floating Bottom Input Dock -->
        <footer class="input-dock-container">
            <div class="input-dock">
                <input id="prompt" type="text" autocomplete="off" placeholder="Hỏi Luna bất kỳ điều gì..." />
                <button id="sendBtn" class="btn send-btn">
                    <i class="bi bi-send-fill"></i>
                </button>
            </div>
        </footer>
    </div>

    <!-- Bootstrap Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Marked -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- KaTeX -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

    <!-- AI Scripts -->
    <script defer src="systemprompt.js"></script>
    <script defer type="module" src="ai.js"></script>
    <script defer src="theme-changer.js"></script>
</body>

</html>
