<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA AI Workspace</title>
  <link rel="stylesheet" href="ai.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>
<body>

  <!-- Background Orbs -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- Top Navigation Dock -->
  <header class="top-dock">
    <div class="brand-logo">AURA ASSISTANT</div>
    <nav class="dock-menu">
      <a href="#" class="dock-item active">Hội thoại</a>
      <a href="#" class="dock-item">Thư viện</a>
      <a href="#" class="dock-item">Cài đặt API</a>
    </nav>
    <button class="btn-clear" id="clearHistoryBtn">Xóa lịch sử</button>
  </header>

  <!-- Central Workspace -->
  <main class="workspace">
    <!-- Chat Stream Area -->
    <div class="chat-stream" id="chatBody">
      <div class="message assistant-message">
        <strong>AURA:</strong>
        <div>Chào em, em cần chị hỗ trợ gì hôm nay?</div>
      </div>
    </div>

    <!-- Floating Input Pill -->
    <div class="input-wrapper">
      <input type="text" id="prompt" placeholder="Hỏi bất kỳ điều gì hoặc nhập yêu cầu..." autocomplete="off">
      <button class="btn-circle btn-img" id="generateImgBtn" title="Tạo ảnh AI">🎨</button>
      <button class="btn-circle btn-send" id="sendBtn" title="Gửi tin nhắn">➔</button>
    </div>
  </main>

  <script src="ai.js"></script>
</body>
</html>
